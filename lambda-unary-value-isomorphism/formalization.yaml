  "status": {
    "scope": "There exist total computable F from Mathlib partial-recursive codes to terms and G from terms to codes. Every F output is closed; G(F c)=c for every code; F(G t)=t for every closed term; and the partial numerical value of F c at every input equals eval c on that input. G is total on open terms, but no inverse identity is asserted there. The result is not an arbitrary conventional Turing-machine syntax translation or an executable extractor from arbitrary computability proofs. Numerical-result absence corresponds exactly to undefinedness of the partial function; it is not identified with divergence or absence of nonnumerical normal forms.",
