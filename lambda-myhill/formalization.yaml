  "status": {
    "scope": "For an arbitrary predicate of lambda terms whose members are closed, an explicitly computable productive-complement map yields injective computable closed-output reductions from every r.e. predicate on a Primcodable domain. The productive condition applies to recursive recognizers avoiding the predicate on closed syntax. Numerical extensionality is not assumed. One-one completeness additionally assumes that the target predicate is r.e. The finite-avoidance and fresh-output construction is computable, not claimed primitive recursive. Fixed points and codes for arbitrary r.e. predicates are selected by existence, not extracted from proofs. No computable isomorphism theorem or general predicate result without the closed-members hypothesis is claimed; missing numerical observations are not equated with divergence.",
