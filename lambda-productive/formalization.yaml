  "status": {
    "scope": "For a predicate on terms whose members are closed, an explicitly computable productive complement yields uniform closed-output computable reductions from all r.e. predicates on Primcodable domains. A primitive-recursive productive map yields primitive-recursive reductions. Separately, numerical extensionality on closed programs lets padding turn any closed-output computable transformation into an injective one preserving membership. Together, an r.e. closed numerical-extensional language with a computable productive complement is one-one complete; with a primitive-recursive productive map the reductions may be primitive recursive. Fixed points and codes for arbitrary r.e. predicates are selected by existence; no extractor from proofs is claimed. No unrestricted creative-set or computable-isomorphism theorem is asserted. Missing numerical observations are not equated with divergence.",
