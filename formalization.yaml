    models:
    - GPT-6 Astra Pro
    framework: ChatGPT with coordinated Lean proof-development agents
    tool_setup: Lean 4.35.0, pinned Mathlib, exact rational and integer witness generation in Python,
      ordinary Lean kernel decisions, analytic interval and polynomial bounds, source comparison, and
      axiom audits.
    prompting_notes: Complete the actual numerical lower-bound proof and its literal discrete Erdős36
      statement. Do not replace numerical premises by report hashes, native decision oracles, or a conditional
      return assumption that simply restates the desired conclusion.
  - method: agent
    models:
    - Codex coding agent
    framework: Codex with independently scoped AI source-fidelity review
    tool_setup: Exact rational generators, fixed-point leaf checks, Lean 4.35.0 and the pinned Mathlib revision.
    prompting_notes: Formalize the frozen fully_joint32 improvement, retain ordinary-kernel source binding,
      consider verification time and memory, and prepare a source-bound Palomar packet.
  notes: AI agents produced and repaired source code and performed separate internal reviews. The stronger
    certificate and the predecessor have distinct verification evidence. Human peer review, editorial decisions,
    publication and registration have separate provenance.
fidelity:
  divergences: The continuous model uses Borel measurable representatives on [0,2], a translation of the
    usual interval of length two. A separately proved finite step embedding gives the literal integer
    theorem, so no equality of the continuous and discrete optimization problems is assumed. The extension
    from Borel to arbitrary completed-Lebesgue-measurable representatives is not separately formalized.
    The asymptotic conclusion is stated as a liminf; the stronger finite representation-count result holds
    for every positive N, without assuming limit existence.
review:
  status: agent-reviewed
  reviewers:
  - Separate internal AI statement-fidelity and mathematical reviewers
  notes: Separate AI-agent reviews examine the physical normalization, the exact finite cover, the actual
    source bindings, and the discrete statement transfer. See the final source-bound verification receipt.
    Ordinary compiler
    and axiom success does not establish human peer review, novelty, best-known-record status, protected
    Comparator or NanoDa success, editorial acceptance, or registration.
