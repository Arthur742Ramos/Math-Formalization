version: v0.4
project:
  name: A certified lower bound for Erdős' minimum-overlap problem
  description: Lean proof of the lower bound c > 0.380627948 in Erdős problem 36. The formalization proves
    the stronger lower bound 0.3806279485 for the discrete normalized liminf and for the binary and relaxed
    Borel continuous overlap infima. For every positive integer N and every equal partition of the first
    2N integers, it also proves an explicit integer difference count exceeding 0.380627948 N. The proof
    instantiates physical boundary capacity and continuous profile duality with actual Fourier, periodic,
    phase Gram, and exact integral certificates. The complete numerical result passed ordinary Lean compilation
    and transitive axiom checks. Protected comparison and independent-kernel status are recorded separately;
    no exact-constant solution, external peer review, novelty certification, or registration is asserted.
  authors:
  - Arthur Freitas Ramos
  - David Barros Hulak
  - Ruy Jose Guerra Barretto de Queiroz
  responsible_maintainers:
  - Arthur Freitas Ramos
  license: BSD-3-Clause
