  id: https://github.com/justinwetch/erdos-36-minimum-overlap/tree/27b1cba5f929da7182e97d2e8c42c78c5ee5d4a8
  type: other
  relationship: adapts
  note: Substantive inherited Fourier, periodic, and phase Gram framework. The actual source coefficients,
