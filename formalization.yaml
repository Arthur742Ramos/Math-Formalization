version: v0.4
project:
  name: A certified lower bound for Erdős' minimum-overlap problem
  description: Lean formalization of the lower bound c > 0.3806279907 in Erdős problem 36. The selected statements give
    the stronger lower bound 0.380627990701 for the discrete normalized liminf and for the binary and relaxed
    Borel continuous overlap infima. For every positive integer N and every equal partition of the first
    2N integers, it also gives an explicit integer difference count exceeding 0.3806279907 N. The proof
    instantiates physical boundary capacity and continuous profile duality with actual Fourier, periodic,
    phase Gram, and exact integral certificates. Verification outcomes are bound to the exact source and metadata
    hashes in the release packet's immutable reports;
    no exact-constant solution, external peer review, novelty certification, or registration is asserted.
  authors:
  - Arthur Freitas Ramos
  - David Barros Hulak
  - Ruy Jose Guerra Barretto de Queiroz
  responsible_maintainers:
  - Arthur Freitas Ramos
  license: BSD-3-Clause
sources:
