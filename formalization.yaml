  type: other
  relationship: formalizes
  note: An unpublished research note preceded this Lean formalization. The note is not included in this
    repository. The frozen fully_joint32 kernel and ten additional rational witnesses are retained as
    generator inputs. External interval-arithmetic verdicts are not trusted by the Lean proof. No external
    specialist review or novelty determination is asserted.
  author_endorsement: n/a
- title: Minimum-overlap Fourier, periodic, and phase Gram certificate framework
  authors:
