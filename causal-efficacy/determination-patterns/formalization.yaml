version: v0.4
project:
  name: Determination Patterns in Infinite Dependency Models
  description: >-
    A Lean development of determination in infinite Boolean dependency models,
    including pattern realization, attainable determinate regions, contextual
    uniqueness, source-labelled spines, and a copy-majority representation.
    The Comparator configurations select separately scoped parts of this
    development; no single component is asserted to cover the whole paper.
  authors:
