review:
  status: >-
    Independent internal AI statement-level review compared manuscript version 6
    with Lean commit 5d035afa3d50bc9a4c3058232d5b5a2c57475026. All numbered
    results have corresponding Lean declarations. This successor adds the
    independently reviewed four-gate classification that was not explicit in
    5d. Release-wide source and evidence review remains open; this is not a
    human proof review, exhaustive supporting-proof audit, or cross-kernel
    verification. The Palomar registration names the earlier 5d central theorem.
