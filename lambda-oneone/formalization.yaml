  "status": {
    "scope": "Full-beta numerical results of explicit untyped de Bruijn lambda syntax. Padding is primitive recursive, injective in the tag and original syntax, preserves partial numerical behavior for every term including open terms, and maps closed inputs to closed terms. Every r.e. predicate on a Primcodable domain has an injective primitive-recursive reduction to closed terms returning Church zero on input zero. A fixed code for an arbitrary r.e. predicate is selected by existence, not extracted from its proof. Productive complement is stated with a closed-term recognizer condition. Absence of a numerical result is not asserted to be divergence.",
