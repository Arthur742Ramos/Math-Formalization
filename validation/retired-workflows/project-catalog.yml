name: Project catalog
on:
  push:
    branches: [main]
    paths: ['README.md', 'PROJECTS.md', 'REGISTRATIONS.json', 'READINESS.md', 'READINESS.json', 'catalog-evidence/**', 'scripts/check_catalog.py', 'scripts/check_imported_definitions.py', 'tests/test_imported_definitions.py', 'topology/**/verification/material-imported-definitions.json', 'topology/**/MATERIAL-DEFINITIONS.md', 'scripts/check_readiness.py', 'scripts/check_preparations.py', 'PREPARATIONS.json', 'AGENTS.md', 'RELEASE-HANDOFFS.json', 'scripts/check_release_packet.py', 'tests/test_release_packet.py', 'tests/test_preparation_bindings.py', '.github/workflows/project-catalog.yml']
  pull_request:
    paths: ['README.md', 'PROJECTS.md', 'REGISTRATIONS.json', 'READINESS.md', 'READINESS.json', 'catalog-evidence/**', 'scripts/check_catalog.py', 'scripts/check_imported_definitions.py', 'tests/test_imported_definitions.py', 'topology/**/verification/material-imported-definitions.json', 'topology/**/MATERIAL-DEFINITIONS.md', 'scripts/check_readiness.py', 'scripts/check_preparations.py', 'PREPARATIONS.json', 'AGENTS.md', 'RELEASE-HANDOFFS.json', 'scripts/check_release_packet.py', 'tests/test_release_packet.py', 'tests/test_preparation_bindings.py', '.github/workflows/project-catalog.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    name: Project catalog and preserved source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check saved record bindings, preparations and preserved packages
        run: python3 scripts/check_catalog.py --package-checks
      - name: Check retained material imported definitions without claiming source provenance
        run: python3 scripts/check_imported_definitions.py --project-path topology/kuratowski-ulam
      - name: Check locally compact Baire hypothesis evidence without claiming source provenance
        run: python3 scripts/check_imported_definitions.py --project-path topology/locally-compact-baire
      - name: Check Banach–Mazur hypothesis evidence without claiming source provenance
        run: python3 scripts/check_imported_definitions.py --project-path topology/banach-mazur-baire
      - name: Check category-game hypothesis evidence without claiming source provenance
        run: python3 scripts/check_imported_definitions.py --project-path topology/banach-mazur-category
      - name: Check strong Choquet imported meanings without claiming source provenance
        run: python3 scripts/check_imported_definitions.py --project-path topology/strong-choquet-polish
      - name: Reject incomplete or misleading material-definition evidence
        run: python3 -m unittest discover -s tests -p 'test_imported_definitions.py' -v
      - name: Check source-contained release status and historical bindings
        run: python3 scripts/check_release_packet.py --project-path topology/collectionwise-normal --commit ${{ github.sha }} --historical-report catalog-evidence/collectionwise-2026-10-18/full-report.json
      - name: Reject stale source accounts and wrong-source handoff evidence
        run: python3 -m unittest discover -s tests -p 'test_release_packet.py' -v
      - name: Reject wrong run, repository or attempt pointers
        run: python3 -m unittest discover -s tests -p 'test_preparation_bindings.py' -v
