name: Palomar Perfect metrizable images mechanical preflight
on:
  push:
    branches: ['topology/perfect-metrizable-images']
    paths: ['topology/perfect-metrizable-images/**', '.github/workflows/palomar-perfect-image.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roles:
    name: Package consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check metadata and README roles
        working-directory: topology/perfect-metrizable-images
        run: |
          python3 scripts/check_package.py --axiom-log verification/local-axioms.txt
  perfect_image:
    needs: roles
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: perfimage001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"project_path":"topology/perfect-metrizable-images","comparator_config_path":"topology/perfect-metrizable-images/comparator.json","formalization_metadata_path":"topology/perfect-metrizable-images/formalization.yaml","authorization_relationship":"I have approval from a responsible author or maintainer"}'
