name: Composants
on:
  push:
    paths: ['topology/composants/**', '.github/workflows/composants.yml', 'LICENSE']
  pull_request:
    paths: ['topology/composants/**', '.github/workflows/composants.yml', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: topology/composants
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Check source layout and pins
        run: python3 scripts/verify.py --check-package-only
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: topology/composants
          auto-config: 'false'
          build: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - name: Ordinary Lake build and fresh Lean checks
        run: python3 scripts/verify.py --lake-build --output .lake/verification.json
      - name: Complete definition evidence and negative controls
        run: python3 scripts/check_definitions.py --compare-mathlib --self-test
