  "status": {
    "scope": "There are total computable F from Mathlib partial-recursive-code/input pairs to terms and G from terms to such pairs. Every F output is closed; G(F p)=p for every pair; F(G t)=t for every closed term; and evaluation of p is defined exactly when F p applied to Church zero reaches Church zero. G is total on open terms, but no inverse identity is asserted there. The result is not a pointwise numerical-function preservation theorem, an arbitrary conventional Turing-machine syntax translation, or an executable extractor from proofs of computability. Undefined numerical observation is not identified with divergence.",
