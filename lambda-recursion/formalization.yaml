  "status": {
    "scope": "Full-beta numerical observations of closed de Bruijn lambda terms. For each fixed computable syntax transformation a primitive-recursive family of closed numerical fixed points exists, even if the transformation returns open syntax. The self-code result returns the project encoding as a Church numeral; it is not literal source reproduction. The productive map handles recognizer supersets disjoint on closed terms. Fixed code selection is existential, not an extractor from arbitrary computability proofs; missing numerical results are not equated with divergence.",
