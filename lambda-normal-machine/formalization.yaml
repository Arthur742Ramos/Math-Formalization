  "status": {
    "scope": "One explicit finite machine receives directTermNumber t for an arbitrary untyped term t. It yields n+1 exactly for the Church numeral n, yields zero exactly for a nonnumerical beta-normal form, and has no reachable halting configuration exactly when no beta-normal form is reachable. Every reachable halt decodes. No conversion from executableTermEncode and no practical size bound is claimed.",
    "sorry_count": 1,
    "sorry_in_definitions": 0,
