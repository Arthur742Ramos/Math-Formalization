    "name": "A subexponential bound for induced degree repetition",
    "description": "Every sufficiently large N-vertex graph contains an induced subgraph of order between r and 2r−1 with a degree class of proportion at least 1−η, where r is the ceiling of K log N, for every K>0 and 0<η<1. Consequently log g(k)=o(k) for the least Caro–Yuster repetition threshold.",
