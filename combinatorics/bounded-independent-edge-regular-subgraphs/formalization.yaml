version: v0.4
project:
  name: Regular induced subgraphs in bounded independent-edge arrays
  description: >-
    Lean formalization of regular induced subgraph bounds for finite random graphs
    with independent, possibly unequal edge probabilities bounded away from zero
    and one. The selected theorems give two logarithmic lower bounds, and
    exact-order guarantees for arrays with equal expected degrees, Lipschitz
    kernels, and bounded-rank symmetric completions. The library also develops
    the degree-vector estimates, the overlap second moment, and a product model
    with matching square-root bounds.
  authors:
    - Arthur Freitas Ramos
    - David Barros Hulak
    - Ruy Jose Guerra Barretto de Queiroz
  responsible_maintainers:
    - Arthur Freitas Ramos
  license: Apache-2.0
classification:
  arxiv:
    - math.CO
    - math.PR
  msc2020:
    - 05C80
    - 05C07
    - 60F05
sources:
  - title: Regular induced subgraphs in bounded independent-edge arrays
    authors:
      - Arthur Freitas Ramos
      - David Barros Hulak
      - Ruy J. G. B. de Queiroz
    type: paper
    relationship: formalizes
    note: >-
      The supplied 17-page manuscript has PDF SHA-256
      7cba4a4dcf525926b283ca036f4970d6321f50dd2ca0f3efe01b643be4a1e32d.
      Theorem 1.1 on pages 1 and 2 supplies the four selected statements.
