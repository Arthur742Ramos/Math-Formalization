    "name": "Verified components of cyclic covering constructions",
    "description": "A partial Lean formalization of finite cyclic covering schemes. The principal theorem proves that no sixth column extends any of seventeen supplied literal ten-row, five-column representatives over the cyclic group of order nine, under the original modular-difference extension predicate. Eligible lower profiles and digit equations are derived from a putative extension, not assumed. The arithmetic exclusion covers all 72 eligible profiles by 71 linear contradictions over the three-element field and one quadratic contradiction. Generic repeated-zero normalization is also proved for arbitrary ten-row coverings. Additional results include explicit order-nine covering witnesses, an index-two 18-by-6 seed, the published index-one 63-by-7 difference matrix, finite quota-enumeration completeness, and qualified lifting and transformation implications. Exhaustive classification, canonical graph transport, unrestricted 10-by-6 nonexistence, and infinite-family theorems are not formalized here. No novelty or priority claim is made.",
