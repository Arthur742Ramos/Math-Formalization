  "status": {
    "scope": "For a closed source hole term and a one-hole context built from abstraction and either application side, a fixed translated target context commutes literally with plugging. Fixed context terms may be open if the whole plugged source is closed. Weak call-by-name abstraction convergence agrees with weak call-by-value convergence under the corresponding translated target test, with exact translated-value readback. Source contextual equivalence for closed terms transports exactly to equivalence under translated source-context tests, not arbitrary target contexts. An open-hole counterexample shows the literal plugging law requires its stated hypothesis. No divergence equivalence, Church-numeral readback, full beta-normalization correspondence, or complexity bound is claimed.",
    "sorry_count": 9,
    "sorry_in_definitions": 0,
