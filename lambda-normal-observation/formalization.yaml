  "status": {
    "scope": "For arbitrary terms, a partial-recursive normal-order observer has type Part (Option Nat): membership of some n is exactly full-beta reachability of Church numeral n; membership of none is exactly reachability of a beta-normal form with no reachable numeral; Part.none is equivalent to the absence of any reachable beta-normal form. Bounded normal-order execution and observation are primitive recursive. Eta-expanded zero is a nonnumerical normal form and Omega has no normal form. This does not claim that every beta-reduction strategy diverges, nor that numerical absence alone is divergence.",
    "sorry_count": 11,
    "sorry_in_definitions": 0,
