name: Palomar order-arcs preflight
on:
  push:
    paths: ['topology/order-arcs/**', '.github/workflows/palomar-order-arcs.yml', 'LICENSE']
  pull_request:
    paths: ['topology/order-arcs/**', '.github/workflows/palomar-order-arcs.yml', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  order-arcs:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: orderarcs001
      execution_profile: palomar-standard-v1
      mode: full
      options: '{"project_path":"topology/order-arcs","comparator_config_path":"topology/order-arcs/comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
