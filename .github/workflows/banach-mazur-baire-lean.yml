name: Banach–Mazur Baire Lean verification
on:
  pull_request:
    paths: ['topology/banach-mazur-baire/**', 'scripts/check_imported_definitions.py', '.github/workflows/banach-mazur-baire-lean.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: topology/banach-mazur-baire
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Check frozen package
        run: python3 scripts/check_package.py
      - name: Install checksum-pinned Elan in user space
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/elan.tar.gz" \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/elan-install"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan-install"
          "$RUNNER_TEMP/elan-install/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install exact toolchain and scoped canonical cache
        run: |
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          lean --version | tee "$RUNNER_TEMP/banach-mazur-baire-lean-version.txt"
          lake --version | tee "$RUNNER_TEMP/banach-mazur-baire-lake-version.txt"
          lake exe cache get Mathlib.Order.Zorn Mathlib.Data.Set.Pairwise.Basic Mathlib.Topology.Baire.Lemmas
      - name: Authenticate material imported definitions at the exact dependency pin
        run: python3 ../../scripts/check_imported_definitions.py --project-path topology/banach-mazur-baire --dependency-root .lake/packages/mathlib
      - name: Authenticate retained Lean-core infrastructure against the exact installed compiler
        run: |
          python3 - "$(lean --print-prefix)/src/lean/Init/Prelude.lean" <<'PYCORE'
          import hashlib, json, pathlib, sys
          manifest = json.loads(pathlib.Path('verification/core-definitions.json').read_text())
          source = pathlib.Path(sys.argv[1]).read_bytes()
          assert hashlib.sha256(source).hexdigest() == manifest['sha256']
          assert hashlib.sha1(b'blob ' + str(len(source)).encode() + b'\0' + source).hexdigest() == manifest['git_blob_sha1']
          for excerpt in manifest['excerpts']:
              assert b''.join(source.splitlines(keepends=True)[excerpt['first_line'] - 1:excerpt['last_line']]).decode() == excerpt['text']
          PYCORE
      - name: Build proofs and both independent module contracts
        run: |
          set -o pipefail
          lake build 2>&1 | tee "$RUNNER_TEMP/banach-mazur-baire-build.log"
      - name: Fresh transitive axiom audit and frozen-source check
        run: |
          lake env lean AxiomAudit.lean > "$RUNNER_TEMP/banach-mazur-baire-axioms.txt"
          python3 scripts/check_package.py --axiom-log "$RUNNER_TEMP/banach-mazur-baire-axioms.txt"
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: banach-mazur-baire-lean
          path: |
            ${{ runner.temp }}/banach-mazur-baire-lean-version.txt
            ${{ runner.temp }}/banach-mazur-baire-lake-version.txt
            ${{ runner.temp }}/banach-mazur-baire-build.log
            ${{ runner.temp }}/banach-mazur-baire-axioms.txt
          if-no-files-found: warn
          retention-days: 30
