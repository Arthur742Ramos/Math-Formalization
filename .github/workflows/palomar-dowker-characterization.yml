name: Palomar Dowker characterization mechanical preflight
on:
  push:
    branches: ['topology/dowker-characterization']
    paths: ['topology/dowker-characterization/**', '.github/workflows/palomar-dowker-characterization.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Package transparency and role consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check pins, Challenge, renderer limits and roles
        working-directory: topology/dowker-characterization
        run: python3 scripts/check_package.py
  dowker:
    needs: package
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: dowker000001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"project_path":"topology/dowker-characterization","comparator_config_path":"topology/dowker-characterization/comparator.json","formalization_metadata_path":"topology/dowker-characterization/formalization.yaml","authorization_relationship":"I have approval from a responsible author or maintainer"}'
