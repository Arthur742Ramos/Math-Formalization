name: Sorgenfrey covering
on:
  push:
    branches: ['main']
    paths: ['topology/sorgenfrey-covering/**', '.github/workflows/sorgenfrey-covering.yml', 'LICENSE']
  pull_request:
    paths: ['topology/sorgenfrey-covering/**', '.github/workflows/sorgenfrey-covering.yml', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: topology/sorgenfrey-covering
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          set-safe-directory: false
      - name: Check nested package and retained source
        run: python3 scripts/verify.py --check-package-only
      - name: Identify exact commit
        run: |
          git rev-parse HEAD | tee verification-commit.log
          cat lean-toolchain
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: topology/sorgenfrey-covering
          auto-config: 'false'
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: 'false'
      - name: Fetch pinned dependency cache
        run: lake exe cache get Counterexamples.SorgenfreyLine Mathlib.Topology.Compactness.Lindelof
      - name: Reject unfinished source
        run: |
          if grep -nE '\b(sorry|admit|axiom)\b' SorgenfreyCovering.lean AxiomAudit.lean Challenge.lean Solution.lean scripts/CompareTypes.lean; then
            exit 1
          fi
      - name: Build proofs and instance checks
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
      - name: Audit transitive axioms
        run: |
          set -o pipefail
          lake env lean AxiomAudit.lean 2>&1 | tee axiom-audit.log
          python scripts/check_axioms.py axiom-audit.log
      - name: Compare independent Challenge propositions
        run: |
          set -o pipefail
          lake env lean scripts/CompareTypes.lean 2>&1 | tee statement-check.log
          echo 'All seven independent proposition checks passed' >> statement-check.log
      - name: Compare pinned definition evidence
        run: python3 scripts/check_definitions.py --compare-mathlib --self-test
      - name: Recheck compiled proof terms
        env:
          LEAN_NUM_THREADS: '2'
        run: |
          set -o pipefail
          lake env leanchecker SorgenfreyCovering AxiomAudit Challenge Solution 2>&1 | tee kernel-check.log
          echo 'leanchecker exited successfully' >> kernel-check.log
      - name: Store verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sorgenfrey-verification-${{ github.sha }}
          path: |
            topology/sorgenfrey-covering/verification-commit.log
            topology/sorgenfrey-covering/build.log
            topology/sorgenfrey-covering/axiom-audit.log
            topology/sorgenfrey-covering/kernel-check.log
            topology/sorgenfrey-covering/statement-check.log
