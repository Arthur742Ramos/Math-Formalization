    "name": "Resonant weighted-circle solvability and computational-path periods",
    "description": "For every positive C1 density ρ on the real period-one circle, let m be its positive mean. For every natural n > 0 and continuous forcing f, the actual shifted equation Δρ u − λₙ u = f has an unrestricted actual C2 circle solution exactly when both based computational-trace periods of ρ·f·Cₙ and ρ·f·Sₙ vanish, where λₙ = (2πn/m)² and on the real cover Cₙ(x) = cos(2πn T(x)) and Sₙ(x) = sin(2πn T(x)), with T the normalized arclength coordinate. An equivalent condition uses their actual finite harmonic-cochain periods.",
