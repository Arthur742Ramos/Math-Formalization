    "name": "Harmonic representatives and period separation for computational-path presentations",
    "description": "For finite primitive-step sets in the scoped geometric computational-path model, actual signed trace periods define a cochain complex. Closedness is equivalent to invariance under the entire scoped rewrite relation. Orthogonal projection constructs the unique harmonic representative of every degree-one presentation cohomology class, preserves all loop periods, and induces an actual linear equivalence. Vanishing of all loop periods is equivalent to being a coboundary, without connectivity assumptions; periods separate cohomology and harmonic representatives. A nonzero parallel-edge model and a named-rewrite control expose the distinction from ambient geometric homotopy. Discrete presentation cohomology only, not analytic or Kahler Hodge theory.",
