    "name": "Geometric realization kernel and computational-path period descent",
    "description": "For a finite-generator continuous geometric step system, actual endpoint-fixed path homotopies define a geometric saturation of a sound scoped rewrite presentation. Geometric relation chains equal the real span of nullhomotopic computational-loop chains. The natural map from presentation homology to saturated homology is surjective, with kernel exactly the span of original null-loop homology classes. Cohomology pulls back injectively; its image is the annihilator of that kernel under the existing coefficient pairing. Harmonic and period descent are characterized by zero periods on nullhomotopic computational loops. An explicit constant-path generator is nonzero before saturation and killed by geometry.",
