    "name": "Harmonic characters of represented computational loops",
    "description": "For a finite-generator continuous geometric step system, form the actual subgroup of the ambient fundamental group represented by realized computational loops. If every active computational endpoint is connected to a fixed root by a computational trace, integration gives a linear equivalence from geometric harmonic cochains to algebraic real characters of this subgroup. Construct coefficients from rooted edge loops, prove zero based-loop periods equivalent to actual exactness, and obtain a unique harmonic representative independent of rooting choices. A concrete unit additive circle loop has real winding one by covering-space lifting and yields a nonzero harmonic representative.",
