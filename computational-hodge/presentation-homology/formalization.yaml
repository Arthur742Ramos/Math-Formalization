    "name": "Presentation chain homology and perfect computational-path period duality",
    "description": "Signed chains of actual scoped geometric computational paths define a real presentation chain complex with finitely supported vertex and rule chains. For finite primitive generators, explicit orthogonal projection identifies degree-one chain homology with the existing harmonic space. Coefficient evaluation descends through both homology and cohomology quotients and yields an actual linear equivalence to the algebraic dual. All-basepoint loop classes span real homology and preserve quotient path composition and reversal. A one-loop model has nonzero homology and a fractional class not represented by any single loop. No ambient singular/de Rham comparison or raw-loop abelianization theorem is claimed.",
