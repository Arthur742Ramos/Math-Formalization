    "name": "Geometric harmonic correction and null-loop obstruction",
    "description": "For a finite-generator continuous geometric step system and a sound scoped rewrite presentation P, split every P-harmonic cochain into a canonical geometric harmonic correction and an orthogonal obstruction in the actual nullhomotopic computational-loop span intersected with the old relation orthogonal complement. The quotient map identifies this obstruction space linearly and isometrically with the actual kernel of the natural geometric homology map, using its inherited quotient norm. Every geometric harmonic competitor satisfies an exact Pythagorean approximation identity; the correction is the unique closest one, and the error equals the norm of the kernel class. A constant-path generator has nonzero obstruction and zero correction.",
