    "name": "Equilateral graph resonance and computational traces",
    "description": "For a finite connected oriented unit-edge multigraph, continuous edge forcing, and nonzero real k with sin k = 0 and cos k = 1, the edgewise first-order forced system with common vertex values and Kirchhoff balance is solvable exactly when the total cosine moment vanishes and the sine-moment edge cochain is exact. The latter condition is equivalent to vanishing sine-density integrals over every generated finite closed computational trace. A separate theorem relates the trace density almost everywhere to a local affine edge coordinate and its derivative, with a local representation of the realized quotient path.",
