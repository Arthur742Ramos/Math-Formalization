    "name": "Baire products with locally compact R1 factors",
    "description": "The product X × Y is a Baire space when X is Baire and Y is locally compact and R1 (preregular). No countability, metrizability, separation or quasi-regularity hypothesis is imposed on X, and empty factors are allowed. The substantive supporting construction shows that, for any dense Gδ subset D of X × Y and any fixed nonempty open V in Y, the first projection of D intersect (X × V) contains a dense Gδ subset of X. It uses maximal disjoint open refinements in X and nested compact neighborhoods in Y. Arbitrary label sets and independent type universes are included. The locally compact Hausdorff product result is classical; the formulation adapts the cited projection argument to explicitly weaker separation premises, without any novelty or priority claim.",
