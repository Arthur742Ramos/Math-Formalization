    "name": "Cantor dynamical extension with a dense forward orbit",
    "description": "Every homeomorphism of a closed nowhere-dense subset A of the usual Cantor space Nat -> Bool extends pointwise to an ambient homeomorphism H with a dense forward orbit. Empty A is included. The proof constructs an orbit embedding into the two-sided full shift, extends it using Knaster–Reichbach, proves forward shift orbit density by finite-coordinate patching and Baire, and conjugates back. Classical invariant-subset case only; no novelty claim.",
