    "name": "Alexandroff–Urysohn cover metrization",
    "description": "A T0 space is metrizable if and only if it admits a sequence of open covers such that every intersecting pair of members at the next level has union contained in one member at the current level, and the point-stars form a neighborhood basis. Without separation the same criterion characterizes pseudometrizability. The proof constructs a countably generated co-membership uniformity with exactly the supplied topology. Covers have unrestricted cardinality; empty spaces are included. Classical mathematics, with no novelty or priority claim.",
