    "name": "Countable cellularity of arbitrary products via finite subproducts",
    "description": "An arbitrary product of topological spaces satisfies the countable chain condition (CCC) whenever every finite subproduct does. For nonempty factors this is an equivalence. The proof includes an indexed uncountable delta-system lemma that permits repeated finite supports, and glues compatible cylinders over a finite common root. Arbitrary products of separable spaces are consequently CCC, without a cardinal bound or separation assumptions and allowing empty factors. Continuous-surjection preservation and the discrete-space countability criterion are proved companions. No unrestricted productivity of CCC factors or productively-CCC theorem is asserted.",
