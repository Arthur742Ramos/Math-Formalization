    "name": "Michael's biquotient-map product and characterization theorems",
    "description": "Formalization of Michael (1968), Theorems 1.2 and 1.3: arbitrary indexed products of biquotient continuous surjections are biquotient, without separation assumptions; for a Hausdorff target, biquotience is equivalent to quotientness of the product with every identity map and to the same property for paracompact test spaces. The cover definition, filter and ultrafilter bridges, and an actual Hausdorff paracompact counterexample topology on the underlying target set are proved. Reverse tests use the target universe; the forward implication is separately universe-polymorphic.",
