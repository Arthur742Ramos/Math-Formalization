    "name": "Perfect surjections and paracompactness",
    "description": "A continuous closed surjection from a Hausdorff space, with compact fibres, preserves and reflects ordinary open-cover paracompactness. The paracompact image is proved Hausdorff without assuming target separation. Supporting selected results give inverse transfer without separation or surjectivity, forward transfer to a regular target, local finiteness of images of arbitrary indexed families, and the regular-space criterion using arbitrary locally finite refinements. No metrizability, countability, local compactness or uniform fibre-size assumption is imposed. The source is based on Munkres section 41 exercise 8 and Sakai Theorem 2.6.3(a),(e); it does not claim new mathematics.",
