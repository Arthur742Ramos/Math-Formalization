    "divergences": "Source compact metric setting explicitly generalized. Factor transfer assumes arbitrary topological X,Y, Continuous pi, Surjective pi, Semiconj pi f g and literal WeakMixing f. One-point theorem assumes MetricSpace X, WeakMixing f, explicit point x and actual EquicontinuousAt of all natural iterates at x. Main needs topological X, MetricSpace Y, continuous surjective semiconjugacy, weak mixing of f and pointwise Equicontinuous of g iterates. No compactness, minimality, invertibility, continuity/surjectivity of f or g, uniform-equicontinuity or global nonemptiness premise. Subsingleton means any two points equal, not existence; main empty cases use pointwise binders. Natural time0 included. No converse, sensitivity, maximal-factor construction or regional-proximality claim."
