    "name": "Perfect images of metrizable spaces",
    "description": "Every continuous closed surjection with compact fibers from an arbitrary metrizable space has a metrizable codomain. A new uniform shrinking-star estimate for compact-fiber metric neighborhoods constructs a sigma locally finite open basis on the image. A proper-map formulation and an actual compatible metric are included. No second countability, separability, compact domain, local compactness, completeness, finite-fiber or nonemptiness assumption is made. Target separation is derived. Classical mathematics; no novelty or priority claim.",
