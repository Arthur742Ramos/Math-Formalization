    "name": "Oxtoby's Banach–Mazur characterization of Baire spaces",
    "description": "An arbitrary topological space is Baire if and only if the first player has no winning full-history strategy in the nested nonempty-open Banach–Mazur game. The proof constructs a compatible play with one common point from disjoint dense response levels, and constructs a winning strategy from failure of Baireness. It separately verifies compatible-play existence, equality of the two players’ intersections and the empty-space boundary. No separation, countability or metric hypothesis is imposed. This is classical mathematics, not a novelty or determinacy claim.",
