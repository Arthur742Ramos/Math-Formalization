    "name": "Auslander–Yorke dichotomy for minimal metric maps",
    "description": "For a continuous map of a metric space with every forward natural orbit dense, either the map is sensitive in the open-set pair sense or its natural iterate family is equicontinuous at every point. Stable open sets are propagated using dense orbits and finite early-time continuity. On nonempty spaces nonsensitivity is equivalent to equicontinuity; no compactness or uniform-equicontinuity assertion is required.",
