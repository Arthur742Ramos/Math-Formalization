    "name": "Smirnov's local-to-global metrization theorem",
    "description": "A space is metrizable if and only if it is Hausdorff, paracompact and locally metrizable. A reusable construction gives a sigma locally finite basis from any point-finite open cover of metrizable patches in a paracompact space, without a separation hypothesis. Local neighborhoods, the cover index and each basis layer may have arbitrary cardinality. The proof assumes no second countability, separability, local compactness or nonemptiness. Classical mathematics; no novelty or priority claim.",
