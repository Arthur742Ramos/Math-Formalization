    "name": "Alexandrov\u2013Urysohn characterization of Baire space",
    "description": "A topological space is homeomorphic to Baire space, the countable product of discrete natural numbers, if and only if it is nonempty, Polish, has a basis of clopen sets, and every compact subset has empty interior. The construction partitions each nonempty clopen set into countably infinitely many distinct nonempty clopen children with arbitrarily small diameter. A fully branching shrinking scheme gives a continuous open bijective limit map and therefore a homeomorphism. The converse uses finite coordinate images of compact Baire subsets. This formalizes a classical theorem of Alexandrov and Urysohn; no novelty or priority claim is made.",
