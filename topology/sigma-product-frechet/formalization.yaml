    "name": "Fréchet–Urysohn Σ-products of first-countable spaces",
    "description": "The countable-support Sigma-product of arbitrary first-countable topological factors, relative to an explicit basepoint and with the ordinary product-induced topology, is Frechet-Urysohn. An adaptive finite-coordinate schedule constructs a sequence from each set converging to any of its closure points. The index set may be arbitrary, including empty, and no separation assumption is used for this theorem. Companions give countable tightness and subspace inheritance, density in the full product, T1 countable-closure support control and sequential closedness, and nonsequentiality of an uncountable discrete Boolean cube. No normality, W-space, arbitrary Frechet-factor, compactness or novel-mathematics result is asserted.",
