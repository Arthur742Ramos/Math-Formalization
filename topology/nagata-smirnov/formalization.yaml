    "name": "The full Nagata–Smirnov metrization theorem",
    "description": "A regular Hausdorff space is metrizable if and only if it has an open basis expressed as a countable union of locally finite families. Every layer can have arbitrary cardinality. The development proves the necessity using metric paracompactness, perfect normality from the basis, continuity of arbitrary locally finite bounded coordinates, and a compatible metric via a countable product of metric function spaces. It assumes neither second countability nor separability and includes empty spaces. This formalizes classical mathematics, without claiming new mathematics or first formalization priority.",
