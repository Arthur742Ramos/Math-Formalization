    "name": "Category Hewitt–Savage zero-one law for infinite Baire products",
    "description": "A subset A of X^J with the property of Baire, invariant under every permutation moving only finitely many indices, is meagre or has meagre complement when J is infinite and the actual product space X^J is Baire. A corollary covers countable products of any Polish space. Finite-support displacement, cylinder mixing and the category contradiction are proved, not assumed.",
