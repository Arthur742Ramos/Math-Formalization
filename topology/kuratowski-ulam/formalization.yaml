    "name": "Kuratowski–Ulam category theorem for countable pi-base spaces",
    "description": "For arbitrary topological spaces X and Y, if Y has a countable pi-base, a nowhere dense subset of X × Y has nowhere dense vertical sections outside a meagre subset of X. Meagre subsets likewise have meagre sections for residually many parameters, and residual subsets have residual sections. No Baire, separation or nonemptiness assumption is required for these forward results. For sets with the property of Baire, assuming both factors are Baire, meagreness and residuality are each equivalent to the corresponding generic section property. The product of two Baire spaces is consequently Baire when the second factor has a countable pi-base. Empty spaces and independent type universes are included. Classical mathematics; no novelty or priority claimed.",
