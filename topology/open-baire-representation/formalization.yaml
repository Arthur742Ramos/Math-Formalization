    "name": "Open Baire-space representation of Polish spaces",
    "description": "Every nonempty Polish space is the image of Baire space, the product of countably many discrete natural-number spaces, under a continuous open surjection. The proof constructs a countably branching nonempty open scheme with nested closures, covering children and geometrically shrinking diameters. The image of each basic cylinder is proved exactly equal to its scheme open set. This yields openness and surjectivity of the limit map; existence is also characterized by nonemptiness. These are classical results, with no novelty or priority claim.",
