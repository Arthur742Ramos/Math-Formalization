    "name": "Countable-coordinate factorization for compact products",
    "description": "Every continuous map from an arbitrary product of nonempty compact Hausdorff spaces into a metrizable space factors continuously through a countable subproduct. A uniform-space proof establishes countable coordinate dependence for uniformly continuous maps into separated countably generated uniform spaces. The factor for a fixed coordinate set is unique. Countably many maps share a countable coordinate set. Continuous injections into metrizable targets force only countably many nontrivial factors, giving the exact metrizability criterion for nonempty compact Hausdorff products. Empty index and empty selected-coordinate sets are allowed. These are classical results and no novelty or priority is claimed.",
