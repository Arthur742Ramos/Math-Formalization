    "name": "Continuous open images of Polish spaces",
    "description": "Continuous open surjections preserve the strong Choquet property in arbitrary topological spaces. An explicit full-history strategy lifts each legal target play coherently, keeps the marked point, and maps an actual common source point. Consequently a continuous open metrizable image of a Polish space is Polish. A second-countable completely metrizable source gives a completely metrizable metrizable image. A regular Hausdorff codomain also suffices, by inherited second countability and Urysohn metrizability. These are classical results; no novelty or priority is claimed.",
