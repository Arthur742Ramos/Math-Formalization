    "known_gaps": "No mathematical gap in the selected statements. Source surjectivity, continuity and openness are all explicit. Image completeness means existence of a compatible complete metric; an arbitrary original metric need not be complete. The T3 corollary uses regularity plus T0, which implies Hausdorffness; Hausdorffness alone is not substituted. General nonseparable complete-metrizable image preservation, stationary/convergent classification and quasi-Polish spaces are outside this scope. Verification stages require their own exact-source receipts; public registration, current private attempts and browser-runtime inspection are separate. Protected import closure correction: the original frozen source failed canonical Challenge compilation because its candidate-local foundation import was unavailable in the protected closure. The corrected modules inline the inherited declaration body without changing its mathematical content. Verification outcomes require exact-source receipts outside the frozen package; prior-source reports do not certify these bytes.",
