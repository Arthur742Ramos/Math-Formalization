    "name": "Furstenberg weak mixing and finite diagonal powers",
    "description": "For a continuous self-map of a nonempty topological space, square transitivity implies transitivity of every finite diagonal power, including power zero. A genuine open-pair refinement and finite induction give a common natural forward hitting time for any finite family of nonempty open pairs. The literal two-pair condition is proved equivalent to actual square transitivity.",
