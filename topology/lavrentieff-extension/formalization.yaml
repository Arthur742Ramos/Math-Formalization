    "name": "Lavrentieff's Gδ homeomorphism extension theorem",
    "description": "Every homeomorphism between arbitrary subsets of completely metrizable spaces extends to a homeomorphism between Gδ supersets contained in the respective closures. Empty subsets and ambient spaces are included. A zero-oscillation construction first gives a Gδ continuous extension domain for maps to complete metric spaces. Restricting the two continuous extensions gives mutually inverse maps. The arbitrary supplied topologies are preserved by compatible complete metrics. Classical mathematics, with no mathematical novelty or priority claim.",
