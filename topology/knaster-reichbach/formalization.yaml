    "name": "Knaster–Reichbach homeomorphism extension on Cantor space",
    "description": "Every homeomorphism between closed nowhere-dense subsets of Cantor space extends to a homeomorphism of the entire Cantor space, with exact pointwise agreement. Cantor space is the usual product topology on Nat -> Bool. Empty prescribed subsets are included. The proof constructs matched finite clopen refinements by alternating binary coordinate splits, then obtains mutually inverse continuous limit maps. Classical result; no novelty or priority claim.",
