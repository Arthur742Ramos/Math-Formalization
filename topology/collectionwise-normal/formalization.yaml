    "name": "Paracompact expansion and collectionwise separation",
    "description": "Every locally finite indexed family of arbitrary subsets of a paracompact topological space admits a locally finite open expansion with the same index type, without separation assumptions. In a paracompact normal space, a discrete closed family admits a discrete locally finite open expansion whose closures are pairwise disjoint and lie in prescribed open neighborhoods. Consequently every paracompact Hausdorff space is collectionwise normal. Index and ambient types may be empty and have independent universes; the family has unrestricted cardinality. These are classical results; no novelty is claimed.",
