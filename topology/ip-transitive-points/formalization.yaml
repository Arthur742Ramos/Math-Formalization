      "relationship": "formalizes",
      "note": "Theorem 3.2 (1) implies (2), proof and definitions directly inspected at https://arxiv.org/html/1103.3412v2. The source uses nonempty compact metric systems and an infinite-hitting transitivity convention. The formal theorem assumes a second-countable Baire Hausdorff topology, uses time-zero-permitting open-set transitivity of the square, proves an infinite square-hitting bridge, and treats singleton systems. An unrestricted time-zero orbit-closure claim does not supply positive returns; the proof derives positive returns for generic product-orbit pairs. Li uses IP point transitivity in recurrence classification and disjointness from minimal distal systems (Corollary 5.3); those applications are not formalized here."
