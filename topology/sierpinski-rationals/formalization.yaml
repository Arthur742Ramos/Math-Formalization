    "name": "Sierpiński's characterization of the rationals",
    "description": "Every nonempty countable metrizable topological space without isolated points is homeomorphic to the rational numbers with their usual topology. Conversely, these four properties characterize spaces homeomorphic to the rationals. A clopen basis is derived from the hypotheses. Scheduled binary clopen splits give each point an address with both bits arbitrarily far out; the induced lexicographic order is proved dense, without endpoints, and to generate exactly the original topology. The countable dense-order isomorphism theorem then gives the homeomorphism. This formalizes classical mathematics; no mathematical novelty or priority claim is made.",
