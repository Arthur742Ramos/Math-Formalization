    "name": "Banach–Mazur determinacy for Baire-property targets",
    "description": "For any complete metric space and any target set with the property of Baire, the Banach–Mazur category game is determined: the first player has a winning full-history strategy exactly when the target is nonmeagre, and the second exactly when it is meagre. A win for the first player means one target point lies in every move. The proof constructs meagre-target avoidance without metric assumptions and shrinking closed-trap target forcing in complete metric spaces; it proves actual joint-play existence and excludes simultaneous winners. Empty spaces and equal nested moves are explicit. This is classical mathematics, with no novelty or general determinacy claim.",
