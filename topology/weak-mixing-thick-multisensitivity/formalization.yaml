  "fidelity": {
    "divergences": "Main assumes MetricSpace X, Nontrivial X, Continuous f, Surjective f and literal WeakMixing f. No compactness, minimality or separate no-isolated-points premise; does not derive surjectivity. One delta>0 precedes all k and U:Fin k→Set X. Set of times has explicit 0<n and all i have a pair x,y∈Ui with strict distance separation. Pairs may vary with i,n and block offset; no one fixed tuple across a block, tuplewise/IP or thickly-syndetic/cofinite sensitivity claim. k0 yields positive times, with no indexed point choice. Thick means forall lengths L/lower bounds N, exists start m>=N and all offsets0..L lie in the set. Underlying iterates include time0; main separation times exclude it via startN+1. Finite common-hit helper uses arbitrary topological nonempty X with continuity/surjectivity/weak mixing; geometric helper needs only nontrivial metric X. No invalid intersection-of-arbitrary-thick-sets argument or bounded-diameter API is used."
