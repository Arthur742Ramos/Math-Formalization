    "name": "Weak mixing and thick common multi-sensitivity",
    "description": "A continuous surjective weakly mixing map on a nontrivial metric space admits one positive separation constant such that every finite family of nonempty open sets has arbitrarily long, arbitrarily late blocks of common positive separation times. Witness pairs may depend on the set and time. Finite-family common hitting thickness and separated open targets are proved.",
