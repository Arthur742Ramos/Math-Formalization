    "divergences": "Nonwandering means each nonempty open U has an actual positive return n>0. Recurrent means arbitrarily late natural returns n>N to every open neighborhood of the point; time0 never witnesses a stage. No continuity is needed for the exact metric recurrence/stage characterization. Continuity alone makes the actual recurrent set G-delta, without nonwandering or Baire. Continuous nonwandering maps have residual recurrent sets without Baire; density/equivalence assumes BaireSpace X. No global Nonempty X premise or existence claim is made; empty spaces are handled vacuously, and no nonempty recurrent set is inferred without source nonemptiness. No compactness, second countability, perfection, invertibility, surjectivity, measure recurrence, uniform recurrence, omega-limit or sequential equivalence is claimed."
