  "fidelity": {
    "divergences": "The literal composant is an existential union of proper compact nonempty connected sets through a point. It is empty on a singleton; no point is adjoined. Density and connectedness hold without indecomposability. The second-countable compact Hausdorff countable-family proof uses components of complements of basic opens instead of metric balls. Uncountability is stated as non-countability of the range of the set-valued composant function, without any exact cardinality assertion. Relative claims use the induced topology of the continuum subtype."
  },
