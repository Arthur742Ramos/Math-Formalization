    "name": "Composants of Continua",
    "description": "Every composant of a nondegenerate compact connected Hausdorff space is dense and connected. In the indecomposable case, composants are equal or disjoint and cover the continuum. Second countability gives a countable union representation by proper subcontinua; indecomposability then makes each composant meagre. A nondegenerate second-countable indecomposable continuum has uncountably many distinct composants.",
