    "name": "Omega-bounded Sigma-products and a sharp compactness criterion",
    "description": "For arbitrary T1 omega-bounded factors with an explicit product basepoint, the countable-support Sigma-product is omega-bounded and countably compact. Every countable family is trapped, together with its ambient closure, in a closed compact coordinate box using one countable support. For compact Hausdorff factors, the Sigma-product is compact if and only if only countably many factors contain a point different from the basepoint. Uncountable discrete Boolean Sigma-products are countably compact but not compact. The index and factor universes are independent; the empty index and empty countable subsets are allowed. No first-countability or separability premise is added.",
