    "divergences": "This package proves the omega-bounded specialization of Proposition 2.4 using compact coordinate closures, with explicit support bookkeeping and subtype compactness transport. It does not formalize the more general dense-core pracompactness theorem. The compactness criterion is a separate companion proof by density, Hausdorff closedness and simultaneous nonbasepoint choice. Countable support is not finite support. Compact T1 factors suffice for omega-boundedness, whereas the compactness criterion uses compact Hausdorff factors. An explicit basepoint is supplied, so nonempty factors are not silently manufactured."
