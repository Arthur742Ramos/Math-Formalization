  "fidelity": {
    "divergences": "Baire means category Baire on the actual source topology. Separable means a countable dense subset in the actual target topology. BPPreimages quantifies over all target open sets and means preimages differ from open sets by a meagre symmetric difference. Neither T1/T2 nor Polish source nor injectivity/surjectivity is assumed. Rosendal states the Polish theorem; Banakh introduction records the classical broader Baire/omega-narrow result. We prove the separable-target case, not Banakh new results. Nonmeagreness is assumed only in the selected neighborhood lemma and derived internally for continuity."
