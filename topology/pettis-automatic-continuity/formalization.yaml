    "name": "Pettis automatic continuity for Baire-to-separable topological groups",
    "description": "A homomorphism from a Baire topological group to a separable topological group is continuous if every open inverse image has the property of Baire. The neighborhood lemma for nonmeagre BP sets and the countable right-translate cover are proved internally. No separation, source-Polish, injectivity or surjectivity hypothesis.",
