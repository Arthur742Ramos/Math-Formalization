    "divergences": "The classical metrizable strong Choquet equivalence is restricted explicitly to second-countable metrizable spaces in the difficult converse. First moves consist of a point and an open neighborhood; the second reply is open, contains that point and lies in the input. Non-strict nesting and full reverse opponent histories are available. The metric strategy depends on history length, so no stationarity is claimed. The converse countable response tree uses node implications to ensure a coherent branch; an intersection of level unions alone would be insufficient. The completion/closed-diagonal finish is our formal proof route, not an asserted reproduction of Choquet’s original proof."
