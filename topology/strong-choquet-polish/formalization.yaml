    "name": "The strong Choquet characterization of Polish spaces",
    "description": "For every second-countable metrizable topological space, the second player has a winning full-history strong Choquet strategy if and only if the topology admits a complete metric, equivalently if and only if the space is Polish. Moves include a marked point which every response must retain. The difficult converse constructs a coherent countable response tree, proves the embedded image is Gδ, and transfers complete metrizability from the metric completion. Supporting results prove complete-metric winning strategies without second countability, complete metrizability of Gδ subsets of arbitrary complete metric spaces, actual legal-play existence and explicit empty-space behavior. This is classical mathematics; no novelty or priority is claimed.",
