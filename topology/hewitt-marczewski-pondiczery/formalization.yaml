    "name": "Countable-density Hewitt–Marczewski–Pondiczery theorem",
    "description": "A product of at most continuum many separable topological spaces is separable. The proof constructs a countable family of finite binary tables that realizes every finite assignment of natural-number labels, then applies dense sequences in the factors. No separation, metrizability, compactness or countable-base assumption on the factors is needed. Empty factors and empty index sets are allowed. A companion theorem proves the sharp criterion for discrete Boolean cubes: Bool^I is separable exactly when the index cardinality is at most continuum. This is the classical countable-density case; no arbitrary-cardinal or algebraic generalization, novelty or priority is claimed.",
