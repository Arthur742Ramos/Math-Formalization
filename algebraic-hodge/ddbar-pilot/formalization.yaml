    "name": "Algebraic E1 degeneration from explicit d′d″ identities",
    "description": "For actual commuting integer-indexed double complexes over a field, componentwise image/kernel identities imply biclosed representatives of vertical cohomology classes and vanishing of every higher differential of the column-filtered signed total complex. The genuine first quotient page identifies with vertical cohomology; canonical recurrence agrees on actual representatives and covers all next-page classes. Finite rectangular support gives actual quotient stabilization and a canonical identification with the associated graded of total cohomology with its finite, exhaustive, separated induced filtration. Classical conditional algebraic mathematics; no analytic compact-Kähler theorem or novelty claim.",
